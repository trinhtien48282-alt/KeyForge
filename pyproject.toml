[project]
name = "project-keyforge"
version = "0.2.0.dev0"
description = "Offline password generator and experimental encrypted vault for Windows"
readme = "README.md"
authors = [
    { name = "Akarui", email = "trinhtien48282@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "pyside6>=6.12.0",
]

[project.scripts]
project-keyforge = "project_keyforge:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
