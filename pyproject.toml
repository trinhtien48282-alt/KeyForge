[project]
name = "project-keyforge"
version = "0.2.0.dev0"
description = "Offline password generator and experimental encrypted vault for Windows"
readme = "README.md"
authors = [
    { name = "Akarui", email = "trinhtien48282@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "pyside6>=6.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]